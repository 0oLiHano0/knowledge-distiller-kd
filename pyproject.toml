# pyproject.toml  ——  Poetry 配置（已修正 packages 位置）

[tool.poetry]
name = "kd_tool"
version = "0.1.0"
description = "Knowledge Distiller v4 prototype – detect and manage duplicate or conflicting knowledge."
authors = ["Hansen Lee"]
license = "MIT"
readme = "README.md"

# 告诉 Poetry/Setuptools 打包 kd_tool 目录
packages = [{ include = "kd_tool" }]

# -------------------------------
# 运行时依赖
# -------------------------------
[tool.poetry.dependencies]
python = ">=3.10"
sentence-transformers = ">=2.2.2"
numpy = ">=1.24.0"
torch = ">=2.0.0"
tqdm = ">=4.65.0"
markdown = ">=3.4.0"
pyyaml = ">=6.0.0"
colorama = ">=0.4.6"
unstructured = { version = ">=0.10.0", extras = ["docx", "md"] }
loguru = ">=0.7.0"
sqlalchemy = ">=2.0.0"
alembic = ">=1.12.0"
pydantic-settings = ">=2.2.1"

# -------------------------------
# 开发 / 测试依赖
# -------------------------------
[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.14.0"
black = ">=23.0.0"
isort = ">=5.12.0"
flake8 = ">=6.1.0"
mypy = ">=1.7.0"
pylint = ">=3.0.0"
coverage = ">=7.3.0"
mistune = ">=3.0.1"

# -------------------------------
# CLI 入口
# -------------------------------
[tool.poetry.scripts]
kd-tool = "kd_tool.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
