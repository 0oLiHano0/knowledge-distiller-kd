# pyproject.toml  ——  Poetry 配置（已修正 packages 位置）

[tool.poetry]
name = "kd_tool"
version = "0.1.0"
description = "Knowledge Distiller v4 prototype – detect and manage duplicate or conflicting knowledge."
authors = ["Hansen Lee"]
license = "MIT"
readme = "README.md"

# 告诉 Poetry/Setuptools 打包 kd_tool 目录
packages = [{ include = "kd_tool" }]

# -------------------------------
# 运行时依赖
# -------------------------------
[tool.poetry.dependencies]
python = ">=3.10"
sentence-transformers = ">=2.2.2"
numpy = ">=1.24.0"
torch = ">=2.0.0"
tqdm = ">=4.65.0"
markdown = ">=3.4.0"
pyyaml = ">=6.0.0"
colorama = ">=0.4.6"
unstructured = { version = ">=0.10.0", extras = ["docx", "md"] }
loguru = ">=0.7.0"
sqlalchemy = ">=2.0.0"
alembic = ">=1.12.0"
pydantic-settings = ">=2.2.1"
typer = "^0.12.3"
click = "^8.1.7"
rich = "^13.0.0"
# 推荐与typer一起使用rich，以获得更好的CLI输出
simhash = {git = "https://github.com/1e0ng/simhash.git"}

# -------------------------------
# 开发 / 测试依赖
# -------------------------------
[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.14.0"
black = ">=23.0.0"
isort = ">=5.12.0"
flake8 = ">=6.1.0"
mypy = ">=1.7.0"
pylint = ">=3.0.0"
coverage = ">=7.3.0"
mistune = ">=3.0.1"

# -------------------------------
# CLI 入口
# -------------------------------
[tool.poetry.scripts]
kd-tool = "kd_tool.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# -------------------------------
# Pytest 配置
# -------------------------------
[tool.pytest.ini_options]
# 架构师注释：将当前目录（项目根）加入 Python 搜索路径，解决导入问题。
pythonpath = ["."]
# 架构师注释：明确告知 pytest 测试文件的查找路径。
testpaths = ["tests"]
# 架构师注释：以下是 pytest 的一些标准配置，确保它能找到测试。
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# -------------------------------
# 类型检查与开发规范
# -------------------------------
# 架构师注释：所有核心/业务代码必须补全类型提示，禁止Any、object等模糊类型。
# 架构师注释：CI和本地开发均需通过mypy类型检查，确保类型安全。
# 架构师注释：如需跳过类型检查，必须加显式注释并说明原因。

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
warn_return_any = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true