name: KD-Tool CI

on:
  push:
    branches: [ "feature/architecture-refactor-v4" ]   # 仅监控该分支
  workflow_dispatch:                                   # 可手动触发

jobs:
  check:
    runs-on: ubuntu-latest

    # 推荐缓存，加快二次安装速度
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    #--------- Poetry 安装与缓存 ----------#
    - name: Install Poetry
      run: pip install poetry

    - name: Cache Poetry virtualenv
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry    # Poetry 下载缓存
        key: ${{ runner.os }}-poetry-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install project (+dev) with Poetry
      run: poetry install --with dev

    #--------- 静态检查 / 架构测试 ----------#
    - name: Run unit / rule tests
      run: poetry run pytest -q

    - name: Type-check (allow warnings for now)
      run: |
        poetry run mypy kd_tool || true

    - name: Black format check
      run: |
        continue-on-error: true
        poetry run black --check kd_tool
