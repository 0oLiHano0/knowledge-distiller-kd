name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTING: 1
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: 1
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify directory structure
        run: |
          mkdir -p instance logs output decisions input
          echo "Directory structure created successfully"
          ls -la

      - name: Run code quality checks
        run: |
          echo "Running code formatting checks..."
          black --check --diff .
          isort --check-only --profile black --diff .
          echo "Running type checks..."
          mypy knowledge_distiller_kd tests

      - name: Run unit tests with coverage
        run: |
          pytest tests/storage/ tests/core/ --cov=knowledge_distiller_kd --cov-report=xml -v

      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v
        continue-on-error: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
        continue-on-error: true
        
      - name: Summary
        run: |
          echo "CI pipeline completed!"
          echo "Check detailed test results above"
